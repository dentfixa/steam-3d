<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07080b);scene.fog=new THREE.Fog(0x07080b,22,48);
scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,200);
const ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.autoRotate=false;ctl.minDistance=1;ctl.maxDistance=30;ctl.maxPolarAngle=Math.PI*.49;
const sun=new THREE.DirectionalLight(0xfff2e0,2);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:8,bottom:-8});scene.add(sun);
const rimL=new THREE.DirectionalLight(0x7fa8ff,1.2);rimL.position.set(-8,5,-8);scene.add(rimL);
const fireL=new THREE.PointLight(0xff7a20,8,4,1.5);fireL.position.set(-1.9,1.3,0);scene.add(fireL);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.MeshStandardMaterial({color:0x0c0d10,roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
// track
for(const z of [-.75,.75]){const r=new THREE.Mesh(new THREE.BoxGeometry(24,.08,.08),new THREE.MeshStandardMaterial({color:0x777a80,metalness:1,roughness:.35}));r.position.set(-1.5,.04,z);scene.add(r);}
for(let i=0;i<34;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.25,.06,2.2),new THREE.MeshStandardMaterial({color:0x2a1d14,roughness:1}));s.position.set(-13+i*.7,.0,0);scene.add(s);}
const M={
 black:()=>new THREE.MeshPhysicalMaterial({color:0x15171b,metalness:.5,roughness:.35,clearcoat:.8}),
 green:()=>new THREE.MeshPhysicalMaterial({color:0x0f4a2c,metalness:.3,roughness:.3,clearcoat:1}),
 red:()=>new THREE.MeshPhysicalMaterial({color:0x9c1010,metalness:.3,roughness:.35,clearcoat:1}),
 brass:()=>new THREE.MeshStandardMaterial({color:0xd8a640,metalness:1,roughness:.25}),
 steel:()=>new THREE.MeshStandardMaterial({color:0xc4c8d0,metalness:1,roughness:.22}),
 iron:()=>new THREE.MeshStandardMaterial({color:0x4a4d52,metalness:.8,roughness:.5}),
 copper:()=>new THREE.MeshStandardMaterial({color:0xc46a3a,metalness:1,roughness:.3}),
 brick:()=>new THREE.MeshStandardMaterial({color:0x8a3a22,roughness:.9}),
 coal:()=>new THREE.MeshStandardMaterial({color:0x111111,roughness:.7,emissive:0xff4400,emissiveIntensity:0}),
 coalcold:()=>new THREE.MeshStandardMaterial({color:0x151515,roughness:.6,metalness:.2}),
 flame:()=>new THREE.MeshBasicMaterial({color:0xff8a1a,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}),
 water:()=>new THREE.MeshPhysicalMaterial({color:0x1f6fff,transparent:true,opacity:.6,emissive:0x0a2a80,roughness:.1,metalness:0}),
 wood:()=>new THREE.MeshStandardMaterial({color:0x5a3a22,roughness:.8}),
};
const GN={boiler:'보일러·화실',steam:'증기 계통',cyl:'실린더·밸브',run:'주행장치',body:'차체·운전실',tender:'텐더'};
const pieces=[],asms=[];
function asm(name,grp,dir=[0,0,0]){const g=new THREE.Group();g.userData={name,grp,dir:new THREE.Vector3(...dir),base:new THREE.Vector3(),anim:false};scene.add(g);asms.push(g);return g;}
function add(g,geo,mat,p=[0,0,0],r,name,shell=false){const m=new THREE.Mesh(geo,M[mat]());m.position.set(...p);if(r)m.rotation.set(...r);m.castShadow=m.receiveShadow=true;
 m.userData={name,grp:g.userData.grp,shell};if(shell){m.material.transparent=true;}g.add(m);pieces.push(m);return m;}
const box=(w,h,d,r=.15)=>new RoundedBoxGeometry(w,h,d,2,Math.min(w,h,d)*r);
const cylX=(r,l,s=32,open=false)=>new THREE.CylinderGeometry(r,r,l,s,1,open).rotateZ(Math.PI/2);
const cylY=(a,b,l,s=24)=>new THREE.CylinderGeometry(a,b,l,s);
const cylZ=(r,l,s=32)=>new THREE.CylinderGeometry(r,r,l,s).rotateX(Math.PI/2);
const BY=2.15,BR=.78; // boiler axis
/* ===== 보일러·화실 ===== */
const B=asm('보일러','boiler',[0,1.4,0]);
add(B,cylX(BR,3.8,48,true),'green',[.7,BY,0],null,'보일러 동체(외판)',true);
for(let i=0;i<5;i++)add(B,new THREE.TorusGeometry(BR+.01,.02,8,48).rotateY(Math.PI/2),'brass',[-1.1+i*.95,BY,0],null,`보일러 밴드 ${i+1}`);
add(B,box(1.3,1.9,1.5,.08),'green',[-1.85,1.85,0],null,'화실 외판',true);
add(B,box(1.1,1.5,1.25,.06),'copper',[-1.85,1.85,0],null,'화실 내판(구리)',true);
add(B,box(1.05,.05,1.2),'iron',[-1.85,1.12,0],null,'화격자(그레이트)');
add(B,box(.9,.06,1.1),'brick',[-1.75,2.3,0],null,'벽돌 아치');
add(B,box(1.0,.25,1.1),'iron',[-1.85,.85,0],null,'재받이(애시팬)');
add(B,box(.04,.4,.5),'black',[-2.52,1.5,0],null,'화구 문');
const water=add(B,new THREE.CylinderGeometry(BR-.04,BR-.04,3.75,40,1,false,Math.PI,Math.PI).rotateZ(Math.PI/2),'water',[.7,BY,0],null,'보일러 물(수위)');
water.scale.set(1,1,1);
add(B,box(.9,.55,1.15),'water',[-1.85,2.45,0],null,'화실 주변 물 공간');
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,rr=i%2?.42:.22;add(B,cylX(.045,3.75,10),'steel',[.7,BY-.15+Math.sin(a)*rr*.7,Math.cos(a)*rr],null,`연관(파이어 튜브) ${i+1}`);}
add(B,box(.04,.45,.3),'brass',[-2.3,2.55,.45],null,'수면계');
add(B,cylY(.05,.05,.25),'brass',[-1.9,2.95,.3],null,'안전밸브');
add(B,cylY(.04,.04,.2),'brass',[-1.9,2.95,-.3],null,'기적(호루라기)');
/* coal fire */
const FIRE=asm('화실 불','boiler',[0,1.4,0]);const coals=[],flames=[];
for(let i=0;i<40;i++){const c=add(FIRE,new THREE.DodecahedronGeometry(.06+Math.random()*.05,0),'coal',[-2.3+Math.random()*.9,1.2+Math.random()*.12,-.5+Math.random()],[Math.random()*3,Math.random()*3,0],`불타는 석탄 ${i+1}`);coals.push(c);}
for(let i=0;i<12;i++){const f=add(FIRE,new THREE.ConeGeometry(.09,.5,8),'flame',[-2.2+Math.random()*.8,1.5,-.45+Math.random()*.9],null,`불꽃 ${i+1}`);f.userData.ph=Math.random()*6;flames.push(f);}
/* ===== 증기 계통 ===== */
const S=asm('증기계통','steam',[0,2.2,0]);
add(S,cylY(.28,.32,.5),'brass',[.6,BY+BR+.15,0],null,'증기 돔');
add(S,new THREE.SphereGeometry(.28,24,12,0,Math.PI*2,0,Math.PI/2),'brass',[.6,BY+BR+.4,0],null,'증기 돔 캡');
const reg=add(S,box(.12,.1,.2),'red',[.6,BY+BR-.02,0],null,'레귤레이터(스로틀) 밸브');
add(S,cylX(.03,1.3,10),'steel',[-.6,BY+.5,.3],null,'레귤레이터 조작봉');
add(S,box(.05,.3,.05),'red',[-2.6,2.5,.3],[0,0,.4],'레귤레이터 핸들');
add(S,cylX(.06,2.4,14),'copper',[1.85,BY+.55,0],null,'드라이 파이프');
add(S,box(.2,.3,.6),'iron',[3.05,BY+.4,0],null,'과열기 헤더');
for(let i=0;i<6;i++)add(S,cylX(.022,2.6,8),'copper',[1.75,BY+.25,-.3+i*.12],null,`과열관 ${i+1}`);
for(const [s,n] of [[1,'우측'],[-1,'좌측']]){
 const sp=new THREE.CatmullRomCurve3([[3.05,BY+.3,s*.25],[3.15,1.7,s*.7],[3.0,1.35,s*1.0]].map(p=>new THREE.Vector3(...p)));
 add(S,new THREE.TubeGeometry(sp,20,.055,10),'copper',[0,0,0],null,n+' 증기관(→증기실)');
 const ep=new THREE.CatmullRomCurve3([[2.85,.75,s*.82],[3.0,1.0,s*.5],[3.05,1.45,s*.1],[3.05,1.6,0]].map(p=>new THREE.Vector3(...p)));
 add(S,new THREE.TubeGeometry(ep,20,.06,10),'iron',[0,0,0],null,n+' 배기관(→블라스트파이프)');}
/* ===== 차체: 연실·굴뚝·운전실 ===== */
const Bd=asm('차체','body',[0,.6,0]);
add(Bd,cylX(BR+.04,.9,48,true),'black',[3.05,BY,0],null,'연실(스모크박스)',true);
add(Bd,cylX(BR+.06,.06,48),'black',[3.5,BY,0],null,'연실 문');
add(Bd,cylZ(.06,.1),'brass',[3.54,BY,0],null,'연실 문 손잡이');
add(Bd,cylY(.2,.17,.8,24),'black',[3.05,BY+BR+.3,0],null,'굴뚝',true);
add(Bd,new THREE.TorusGeometry(.2,.04,8,24).rotateX(Math.PI/2),'brass',[3.05,BY+BR+.7,0],null,'굴뚝 테두리');
add(Bd,cylY(.07,.13,.45,16),'iron',[3.05,1.85,0],null,'블라스트파이프(노즐)');
add(Bd,cylY(.17,.2,.45,20,true),'iron',[3.05,BY+.5,0],null,'페티코트(흡출관)',true);
add(Bd,box(7.2,.25,1.7,.05),'red',[0.1,1.15,0],null,'주 프레임(런닝 보드)');
add(Bd,box(.2,.35,1.9),'red',[3.75,.9,0],null,'완충 빔');
for(const s of [1,-1])add(Bd,cylX(.13,.3,16),'iron',[3.95,.9,s*.6],null,(s>0?'우측':'좌측')+' 버퍼');
add(Bd,box(1.4,1.6,2.1,.05),'green',[-3.0,2.35,0],null,'운전실',true);
add(Bd,box(1.65,.08,2.3,.3),'black',[-3.0,3.2,0],null,'운전실 지붕');
add(Bd,box(.9,.15,1.9),'wood',[-3.0,1.35,0],null,'운전실 바닥');

STEPS.forEach((S,i)=>{const b=document.createElement('button');b.textContent=S.t;b.onclick=()=>setStep(i);sdiv.insertBefore(b,document.getElementById('s0'));});
const camTo={p:null,t:null};
function setStep(i){step=i;sdiv.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j==i));
 if(i<0){cap.style.display='none';return;}const S=STEPS[i];cap.innerHTML=`<b>${S.t}</b> ${S.c}`;cap.style.display='block';setCut(true);
 const k=Math.max(1,2/(innerWidth/innerHeight));const tg=V3(S.tg),p=V3(S.cam);camTo.p=tg.clone().add(p.sub(tg).multiplyScalar(k));camTo.t=tg;}
document.getElementById('s0').onclick=()=>setStep(-1);
function setCut(v){cut=v;document.getElementById('cut').classList.toggle('on',v);}
document.getElementById('cut').onclick=()=>setCut(!cut);
const rnb=document.getElementById('run');rnb.onclick=()=>{running=!running;rnb.classList.toggle('on',running);};
document.getElementById('spd').oninput=e=>speed=e.target.value/100;
const sl=document.getElementById('sl');sl.oninput=()=>target=sl.value/100;
function frame(){const k=Math.max(1,2.4/(innerWidth/innerHeight));camTo.p=new THREE.Vector3(5.5*k,3.4*k,9*k);camTo.t=new THREE.Vector3(-.6,1.5,0);}
document.getElementById('reset').onclick=()=>{setStep(-1);frame();};
for(const p of pieces){p.userData.mat0=p.material;p.userData.em0=p.material.emissive?p.material.emissive.clone():null;}
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
R.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];camTo.p=null;});
R.domElement.addEventListener('wheel',()=>camTo.p=null);
R.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 mp.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mp,cam);
 const hit=ray.intersectObjects(pieces.filter(p=>p.visible&&!(cut&&p.userData.shell)),false)[0];sel=hit?hit.object:null;
 document.getElementById('info').textContent=sel?`${sel.userData.name} · ${GN[sel.userData.grp]}`:`부품 ${pieces.length}개`;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});

/* kinematics */
let prevP={};
const STEPFLOW=[['fire'],['fire','water','boil'],['water','boil','live'],['in','cyl','out'],['cyl'],['out','plume','fire']];
const fon=k=>step<0||STEPFLOW[step].includes(k);
function updFluid(on,time,dt){plume.visible=fon('plume');plume.material.uniforms.t.value=time*(.4+speed*1.6);plume.material.uniforms.a.value=running?.75:.25;for(const f of flows){f.visible=on&&fon(f.userData.fk);f.material.uniforms.t.value=time*(.3+speed*1.5);}
 wsurf.visible=on&&fon('water');wMat.uniforms.t.value=time;for(const b of bubbles){b.visible=on;const u=b.userData;u.y+=dt*u.v*(.5+speed);if(u.y>BY){u.y=BY-.6;u.x=-1+Math.random()*3.5;}b.position.set(u.x+Math.sin(time*3+u.z*9)*.02,u.y,u.z);}
 if(!on)return;
 for(const S of SIDES){const p=S.pist,v=p-(prevP[S.s]??p);prevP[S.s]=p;const front=S.vpos>0; // valve forward => rear port live
  const fwd=v>=0; // piston moving forward => rear chamber pushes
  const rearL=Math.max(.02,(p-.05)-(CYX-.47)),frontL=Math.max(.02,(CYX+.47)-(p+.05));
  S.chR.scale.set(rearL,1,1);S.chR.position.set(CYX-.47+rearL/2,CY,S.z);S.chF.scale.set(frontL,1,1);S.chF.position.set(CYX+.47-frontL/2,CY,S.z);
  const hot=new THREE.Color(0xff5a10),hot2=new THREE.Color(0xff1a00),cold=new THREE.Color(0x4a8aff),cold2=new THREE.Color(0x8a96a8);
  const [hc,cc]=fwd?[S.chR,S.chF]:[S.chF,S.chR];hc.material.uniforms.c.value.copy(hot);hc.material.uniforms.c2.value.copy(hot2);hc.material.uniforms.a.value=1;
  cc.material.uniforms.c.value.copy(cold);cc.material.uniforms.c2.value.copy(cold2);cc.material.uniforms.a.value=.7;}}
let th=0,lastQ=0,clock=new THREE.Clock(),T0=0;
const tmp=new THREE.Vector3();
function rodBetween(g,a,b){g.position.set((a.x+b.x)/2,(a.y+b.y)/2,a.z);g.rotation.z=Math.atan2(b.y-a.y,b.x-a.x);g.scale.x=1;}
function place(g,v){g.position.copy(v).addScaledVector(g.userData.dir,curT);g.userData.anim=true;}
let curT=0;const vstate={};
function kin(){
 for(const w of WHEELS){w.W.rotation.z=th+w.ph;}
 for(const S of SIDES){const a=th+S.ph,z=S.z*.9,cp=new THREE.Vector3(RC*Math.cos(a),WY+RC*Math.sin(a),z);
  const xh=cp.x+Math.sqrt(LR*LR-(cp.y-WY)**2);
  const tmpM=new THREE.Group();
  // main rod
  rodBetween(S.MR,cp,new THREE.Vector3(xh,WY,z));S.MR.children.forEach(c=>{});S.MR.userData.base.copy(S.MR.position);S.MR.position.addScaledVector(S.MR.userData.dir,curT);
  // big end located at -LR/2 local => crank pin. ok
  S.XH.position.set(xh,WY,S.z).addScaledVector(S.XH.userData.dir,curT);
  S.PRd.position.set(xh+PR/2,CY,S.z).addScaledVector(S.PRd.userData.dir,curT);
  const px=xh+PR;S.P.position.set(px,CY,S.z).addScaledVector(S.P.userData.dir,curT);S.pist=px;
  S.CR.position.set(RC*Math.cos(a),WY+RC*Math.sin(a),S.z*1.0).addScaledVector(S.CR.userData.dir,curT);
  // walschaerts
  const ea=a+Math.PI/2,E=new THREE.Vector3(RC*Math.cos(a)+.18*Math.cos(ea),WY+RC*Math.sin(a)+.18*Math.sin(ea),S.z*1.1);
  rodBetween(S.ER,new THREE.Vector3(RC*Math.cos(a),WY+RC*Math.sin(a),S.z*1.1),E);S.ER.scale.x=.18/.3;S.ER.position.addScaledVector(S.ER.userData.dir,curT);
  const LP=new THREE.Vector3(-.9,1.35,S.z*1.1),phi=.35*Math.cos(ea);
  S.LK.position.copy(LP).addScaledVector(S.LK.userData.dir,curT);S.LK.rotation.z=phi;
  const tail=new THREE.Vector3(LP.x+Math.sin(-phi)*-.3,LP.y-.3*Math.cos(phi),LP.z);
  rodBetween(S.RR,E,tail);S.RR.scale.x=E.distanceTo(tail);S.RR.position.addScaledVector(S.RR.userData.dir,curT);
  const die=new THREE.Vector3(LP.x-Math.sin(phi)*.12,LP.y+.12*Math.cos(phi),LP.z);
  const vx=CYX+.18*Math.cos(ea+.25)*-1; // valve offset
  const vxx=CYX+.16*Math.sin(a+.3);
  S.V.position.set(vxx,CY+.45,S.z).addScaledVector(S.V.userData.dir,curT);S.vpos=vxx-CYX;
  const ctop=new THREE.Vector3(vxx-.55,CY+.45,S.z*1.1),cbot=new THREE.Vector3(xh-.05,WY-.25,S.z*1.1);
  rodBetween(S.RAD,die,ctop);S.RAD.scale.x=die.distanceTo(ctop);S.RAD.position.addScaledVector(S.RAD.userData.dir,curT);
  S.CL.position.set((ctop.x+cbot.x)/2,(ctop.y+cbot.y)/2,ctop.z).addScaledVector(S.CL.userData.dir,curT);S.CL.rotation.z=Math.atan2(ctop.x-cbot.x,ctop.y-cbot.y)*-1;S.CL.scale.y=ctop.distanceTo(cbot);
  rodBetween(S.UL,cbot,new THREE.Vector3(xh,WY-.1,S.z*1.1));S.UL.scale.x=cbot.distanceTo(new THREE.Vector3(xh,WY-.1,0).setZ(cbot.z))/.35;S.UL.position.addScaledVector(S.UL.userData.dir,curT);}
}
const animated=new Set();SIDES.forEach(S=>['P','PRd','XH','V','MR','CR','ER','RR','LK','RAD','CL','UL'].forEach(k=>animated.add(S[k])));
const q=new URLSearchParams(location.hash.slice(1));
if(q.get('cut'))setCut(true);if(q.get('step'))setStep(+q.get('step')-1);if(q.get('ex')){target=cur=+q.get('ex');sl.value=target*100;}
if(!camTo.p)frame();cam.position.copy(camTo.p);ctl.target.copy(camTo.t);if(q.get('th'))th=+q.get('th');
const col=new THREE.Color();
R.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
 cur+=(target-cur)*.08;curT=cur<.5?2*cur*cur:1-Math.pow(-2*cur+2,2)/2;
 if(running)th-=dt*speed*6;
 for(const g of asms)if(!animated.has(g)&&!WHEELS.some(w=>w.W==g))g.position.copy(g.userData.base).addScaledVector(g.userData.dir,curT);
 for(const w of WHEELS)w.W.position.copy(w.W.userData.base).addScaledVector(w.W.userData.dir,curT);
 kin();
 // puffs: 4 per rev
 const qn=Math.floor(-th/(Math.PI/2));if(qn!=lastQ){lastQ=qn;if(running&&speed>0)puff();}
 for(const p of puffs){if(p.age>8)continue;p.age+=dt;const a=p.age;p.m.position.y+=dt*(1.6-a*.3);p.m.position.x-=dt*speed*3;p.m.scale.setScalar(.5+a*1.5);p.m.material.opacity=Math.max(0,.9-a*.3);p.m.material.rotation+=dt*.3;if(a>3)p.m.visible=false;}
 // fire
 const ff=running?1:.6;coals.forEach((c,i)=>c.material.emissiveIntensity=(1.2+Math.sin(time*6+i)*.5)*ff);
 flames.forEach(f=>{const k=.7+.4*Math.sin(time*13+f.userData.ph)+.2*Math.sin(time*7.3+f.userData.ph*2);f.scale.set(1,k*(.6+speed),1);f.position.y=1.45+k*.12;});
 fireL.intensity=6+Math.sin(time*11)*1.5;
 // cutaway / highlight
 const hk=step>=0?STEPS[step].k:null;
 for(const p of pieces){const u=p.userData;let o=1;if(cut&&u.shell)o=.12;
  const hl=hk&&hk.some(k=>u.name.includes(k));if(hl&&u.shell)o=.3;if(hk&&!hl&&!u.name.includes('석탄')&&!u.name.includes('불꽃'))o=Math.min(o,u.shell?.08:.35);
  if(p.material.opacity!==undefined&&!u.name.includes('불꽃')&&!u.name.includes('물')){p.material.transparent=o<1||u.shell;p.material.opacity=o;p.material.depthWrite=o>.5;}
  if(u.cutonly)p.visible=cut;
  if(step==3&&u.name.startsWith('우측')&&/동륜|메인로드|커플링|리턴|편심|익스팬션|다이|래디어스|콤비네이션|유니온|선도|가이드/.test(u.name))p.visible=false;else if(!u.cutonly)p.visible=true;
  if(step==3&&u.name.startsWith('우측')&&/피스톤|크로스헤드|밸브 헤드/.test(u.name)){p.material.emissive&&p.material.emissive.setRGB(.35,.35,.4);o=1;p.material.opacity=1;continue;}
  if(u.em0&&!u.name.includes('석탄')&&!u.name.includes('물')){if(hl)p.material.emissive.setRGB(.12+.08*Math.sin(time*5),.05,0);else if(p==sel)p.material.emissive.setHex(0x553300);else p.material.emissive.copy(u.em0);}}
 // particles
 const show=cut||step>=0;pts.visible=false;updFluid(show&&curT<.05,time,dt);
 if(false){for(let i=0;i<NP;i++){const P=part[i];P.t+=dt*P.v*(.25+speed*1.2);
  if(P.t>1){P.t=0;const r=Math.random();const sd=Math.random()<.5?1:-1,S=SIDES[sd>0?0:1];const front=S.vpos>0;
   P.k=r<.15?'fire':r<.23?'boil':r<.33?'live':r<.4?'sh':r<.72?`in${sd}${front?1:0}`:`out${sd}${front?0:1}`;}
  const cv=curves[P.k];cv.getPoint(P.t,tmp);pp[i*3]=tmp.x+P.j[0];pp[i*3+1]=tmp.y+P.j[1];pp[i*3+2]=tmp.z+P.j[2];
  const c=PCOL[P.k.startsWith('in')?'in':P.k.startsWith('out')?'out':P.k];const f=1-P.t*.3;pc[i*3]=c[0]*f;pc[i*3+1]=c[1]*f;pc[i*3+2]=c[2]*f;}
  pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;}
 if(camTo.p){cam.position.lerp(camTo.p,.08);ctl.target.lerp(camTo.t,.08);if(cam.position.distanceTo(camTo.p)<.01)camTo.p=null;}
 ctl.update();R.render(scene,cam);});

/* ===== 쉬운 보기 ===== */
{const E=document.getElementById('easy'),$=id=>document.getElementById(id);
 const BEATS=[['불이 물을 데운다',['pFire','pBoil'],'a0'],['증기가 관을 타고 간다',['pPipe','pBoil'],'a1'],['증기가 피스톤을 민다',['pCyl','pPipe'],'a2'],['피스톤이 바퀴를 돌린다',['pWheel','pCyl'],'a3']];
 let b=0,auto=true,bt=0,ang=0,last=performance.now();
 const hq=location.hash;if(/step|cut|ex=|d3|x=/.test(hq))E.classList.add('hide');
 function setB(i){b=(i+4)%4;bt=0;$('ecap').textContent=BEATS[b][0];$('enum').textContent=`${b+1} / 4`;
  ['pFire','pBoil','pPipe','pCyl','pWheel'].forEach(id=>$(id).setAttribute('class',BEATS[b][1].includes(id)?'act':'dim'));
  ['a0','a1','a2','a3'].forEach(a=>$(a).style.display=a==BEATS[b][2]?'':'none');
  document.querySelectorAll('#dots b').forEach((d,j)=>d.classList.toggle('on',j==b));}
 $('enext').onclick=()=>setB(b+1);$('eprev').onclick=()=>setB(b-1);
 $('eplay').onclick=()=>{auto=!auto;$('eplay').classList.toggle('on',auto);};
 $('to3d').onclick=()=>E.classList.add('hide');$('toEasy').onclick=()=>{E.classList.remove('hide');setB(0);};
 const m=hq.match(/beat=(\d)/);setB(m?+m[1]-1:0);if(m){auto=false;$('eplay').classList.remove('on');}
 function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;requestAnimationFrame(loop);if(E.classList.contains('hide'))return;
  bt+=dt;if(auto&&bt>4.5)setB(b+1);const t=now/1000;
  // flames
  $('flames').setAttribute('transform',`translate(135 490) scale(${1+.08*Math.sin(t*9)} ${1+.15*Math.sin(t*7)+.05*Math.sin(t*13)}) translate(-135 -490)`);
  // water wave
  const hot=b==0?1:.4;let d='M230 380 L230 280 ';for(let x=230;x<=630;x+=10)d+=`L${x} ${270+Math.sin(x/28+t*3)*6*hot+Math.sin(x/11-t*5)*3*hot} `;d+='L630 380Z';
  $('water').setAttribute('d',d);$('water').setAttribute('fill',b==0?`rgb(${40+40*Math.sin(t*3)**2|0},${120},255)`:'#1f6fff');
  $('rise').setAttribute('opacity',b<=1?.9:.35);$('rise').setAttribute('y',150-((t*60)%90));
  // pipe flow
  $('pipeFlow').setAttribute('opacity',b>=1?1:0);$('pipeFlow').setAttribute('stroke-dashoffset',-t*140);
  // mechanism: running in beats 3,4 (and slowly otherwise)
  ang-= dt*(b>=2?2.4:.6);
  const cx=420,cy=480,r=48,L=230,px=cx+r*Math.cos(ang),py=cy+r*Math.sin(ang),xh=px+Math.sqrt(L*L-(py-cy)**2);
  $('wheel').setAttribute('transform',`rotate(${ang*180/Math.PI} 420 480)`);
  $('pin').setAttribute('cx',px);$('pin').setAttribute('cy',py);$('mrod').setAttribute('x1',px);$('mrod').setAttribute('y1',py);$('mrod').setAttribute('x2',xh);$('mrod').setAttribute('y2',cy);
  const pX=xh+90;$('prod').setAttribute('x1',xh);$('prod').setAttribute('x2',pX);$('piston').setAttribute('x',pX);
  const vel=-Math.sin(ang); // sign of piston motion
  const ch=$('chamber');ch.setAttribute('x',pX+26);ch.setAttribute('width',Math.max(0,930-pX-26));
  ch.setAttribute('opacity',b>=2?(.45+.5*Math.max(0,Math.sin(t*6)*.2+ (vel<0?1:.35))):(b==1?.25:0));
 }
 requestAnimationFrame(loop);}
